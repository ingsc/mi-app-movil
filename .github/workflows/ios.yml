name: Compilar App de iOS

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4

        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias del proyecto web
        run: npm install

      - name: Compilar aplicacion web
        run: npm run build

           
      - name: Asegurar estructura e instalar CocoPods
        run: |
          cd ios
          # limpiar primero para asegurar el entorno desde cero
          rm -rf Pods Podfile.lock DerivedData
          # creamos el Podfile o lo reescribimos limpio 
          echo "platform :ios, '13.0'" > Podfile
          echo "use_frameworks!" >> Podfile
          echo "" >> Podfile
          echo "target 'App' do" >> Podfile
          echo " project 'App/App.xcodeproj'" >> Podfile
          echo "end" >> Podfile

          pod cache clean --all
          pod install --repo-update

      - name: Compilar proyecto ios (Simulador)
        run: |
          cd ios
          xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 17e' \
          -configuration Debug \
          -derivedDataPath ./DerivedData \

          CODE_SIGN_IDENTITY="" \

          CODE_SIGNING_REQUIRED=NO \

          CODE_SIGNING_ALLOWED=NO \

          ONLY_ACTIVE_ARCH=YES \
          build
