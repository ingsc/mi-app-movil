name: Compilar App de iOS

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4

        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias del proyecto web
        run: npm install

      - name: Compilar aplicacion web
        run: npm run build

      - name: Anadir y sincronizar plataforma iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Asegurar estructura e instalar CocoPods
        run: |
          cd ios
          # si por alguna razon no se crea lo creamos para evitar el fallo
          if [ ! -f Podfile ] || ! grep -q "App.xcodeproj" Podfile;
          then
             echo "platform :ios, '13.0'" > Podfile
             echo "use_frameworks!" >> Podfile
             echo "" >> Podfile
             echo "target 'App' do" >> Podfile
             echo " project 'App/App.xcodeproj'" >> Podfile
             echo " # Anade aqui tus pods" >> Podfile
             echo "end" >> Podfile
          fi
          #forzamos una instalacion limpia eliminando locks antiguo
          rm -rf Pods Podfile.lock
          pod install

      - name: Compilar proyecto ios (Simulador)
        run: |
          cd ios
          xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator ,name=iPhone Air' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          clean build
  
