name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
(OpenJDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dpendencias del proyecto web
        run: npm install

      - name: Sincroniza proyecto con Capacitor Android
        run: npx cap sync android

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK en modo Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK generada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/
outputs/apk/debug/app-debug.apk

